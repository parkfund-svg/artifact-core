  <meta name="theme-color" content="#6fafc7" />
  <link rel="apple-touch-icon" href="assets/logo-ghvia.png" />
  <link rel="stylesheet" href="css/site.css" />
</head>

<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">
      <img src="assets/logo-ghvia.png" alt="GHVIA" />
      GHVIA

      <a href="company.html" onclick="closeMenu()">회사소개</a>
      <a href="contact.html" onclick="closeMenu()">문의</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="auth-card wide">
      <h1 style="text-align:center;margin-bottom:8px">회원가입</h1>
      <p style="text-align:center;color:var(--muted);margin-bottom:32px">퀀트라엑스 계정을 만들어보세요.</p>

      <div class="card">
        <form onsubmit="return handleSignup(event)">

          <div class="form-section">
            <h3>계정 정보</h3>
            <div style="margin-bottom:16px">
              <label for="email">이메일</label>
              <input id="email" type="email" required placeholder="you@example.com" />
            </div>
            <div class="form-row">
              <div>
                <label for="password">비밀번호</label>
                <input id="password" type="password" required placeholder="6자 이상" />
              </div>
              <div>
                <label for="password2">비밀번호 확인</label>
                <input id="password2" type="password" required placeholder="비밀번호 다시 입력" />
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>개인 정보</h3>
            <div class="form-row">
              <div>
                <label for="name">성함</label>
                <input id="name" required placeholder="홍길동" />
              </div>
              <div>
                <label for="birthDate">생년월일</label>
                <input id="birthDate" type="date" required />
              </div>
            </div>
            <div>
              <label>성별</label>
              <div class="chip-group" role="radiogroup" aria-label="성별">
                <input type="radio" name="gender" id="genderM" value="M" required />
                <label for="genderM">남성</label>
                <input type="radio" name="gender" id="genderF" value="F" />
                <label for="genderF">여성</label>
                <input type="radio" name="gender" id="genderO" value="O" />
                <label for="genderO">기타</label>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>연락처</h3>
            <label for="phone">휴대전화 번호</label>
            <input id="phone" type="tel" required placeholder="010-0000-0000" />
            <p class="form-section-desc" style="margin-top:8px">프로모션이나 이벤트 안내 등의 이유로 전화번호를 수집합니다.</p>
          </div>

          <div class="form-section">
            <h3>투자 성향</h3>
            <p class="form-section-desc">주로 어떤 상품을 거래하시나요? 관심 분야를 선택해주시면 맞춤 정보를 제공해드립니다. (복수 선택 가능)</p>
            <div class="chip-group" id="interestGroup">
              <input type="checkbox" id="int-주식" value="주식" /><label for="int-주식">주식</label>
              <input type="checkbox" id="int-해외주식" value="해외주식" /><label for="int-해외주식">해외주식</label>
              <input type="checkbox" id="int-국내선물" value="국내선물" /><label for="int-국내선물">국내선물</label>
              <input type="checkbox" id="int-국내옵션" value="국내옵션" /><label for="int-국내옵션">국내옵션</label>
              <input type="checkbox" id="int-해외선물" value="해외선물" /><label for="int-해외선물">해외선물</label>
              <input type="checkbox" id="int-해외옵션" value="해외옵션" /><label for="int-해외옵션">해외옵션</label>
              <input type="checkbox" id="int-코인" value="코인" /><label for="int-코인">코인</label>
              <input type="checkbox" id="int-ETF" value="ETF" /><label for="int-ETF">ETF</label>
              <input type="checkbox" id="int-채권" value="채권" /><label for="int-채권">채권</label>
              <input type="checkbox" id="int-외환" value="외환" /><label for="int-외환">외환</label>
              <input type="checkbox" id="int-원자재" value="원자재" /><label for="int-원자재">원자재</label>
              <input type="checkbox" id="int-리츠" value="리츠" /><label for="int-리츠">리츠</label>
              <input type="checkbox" id="int-기타" value="기타" /><label for="int-기타">기타</label>
            </div>
          </div>

          <button class="btn btn-primary btn-block" type="submit">회원가입</button>
          <div id="authStatus" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>
        </form>

        <div class="auth-divider">또는</div>

        <button class="btn btn-block" onclick="handleGoogleAuth()">Google 계정으로 가입</button>

        <p style="text-align:center;margin-top:20px;font-size:14px">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div>© 2026 Quantrea-x. All rights reserved. · Powered by (주) 지비아</div>

  </div>

<script src="js/site.js"></script>

</body>
</html>
