<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 지비아</title>
  <style>
    :root {
      --brand: #6FAFC7;
      --accent: #B99B6B;
      --bg: #0f1628;
      --card-bg: rgba(255,255,255,0.03);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 { color: var(--brand); font-size: 24px; }
    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    .btn.secondary {
      background: var(--accent);
    }
    .btn.danger {
      background: #d32f2f;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(111,175,199,0.3);
    }
    .stat-card h3 { color: var(--brand); font-size: 14px; margin-bottom: 8px; }
    .stat-card .number { font-size: 32px; font-weight: bold; color: white; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      background: rgba(111,175,199,0.2);
      color: var(--brand);
      padding: 12px;
      text-align: left;
      font-weight: 600;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    tr:hover {
      background: rgba(255,255,255,0.02);
    }
    .message-cell {
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(111,175,199,0.3);
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🔐 관리자 페이지</h1>
        <p style="color:#888;font-size:14px;margin-top:4px">상담 신청 내역 관리</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="location.href='index.html'">← 홈페이지로</button>
        <button class="btn secondary" onclick="location.href='videos-admin.html'">🎬 매매실제영상 관리</button>
        <button class="btn secondary" onclick="refreshData()">🔄 새로고침</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <h3>전체 상담 건수</h3>
        <div class="number" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <h3>오늘 접수</h3>
        <div class="number" id="todayCount">0</div>
      </div>
      <div class="stat-card">
        <h3>이번 주</h3>
        <div class="number" id="weekCount">0</div>
      </div>
      <div class="stat-card">
        <h3>이번 달</h3>
        <div class="number" id="monthCount">0</div>
      </div>
    </div>

    <div class="actions">
      <input type="search" id="searchInput" class="filter" placeholder="🔍 이름, 이메일, 내용 검색..." style="flex:1;min-width:250px">
      <select id="productFilter" class="filter" onchange="filterData()">
        <option value="">전체 상품</option>
        <option value="BASIC">BASIC</option>
        <option value="PRO">PRO</option>
        <option value="ULTIMATE">ULTIMATE</option>
        <option value="B2B">B2B 문의</option>
        <option value="기타">기타</option>
      </select>
      <button class="btn" onclick="downloadCSV()">📥 CSV 다운로드</button>
      <button class="btn danger" onclick="clearAllData()">🗑️ 전체 삭제</button>
    </div>

    <div id="tableContainer"></div>
  </div>

  <script>
    // Apps Script 웹앱 URL (배포 후 여기에 입력)
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwb1zjFQBFR7EAsFNgOUyIIcKMcP9aW8bbln6agOovTaagpiqZwe593HHFljGBehj1e/exec';
    const ADMIN_PASSWORD = 'artifact2025'; // 관리자 비밀번호 (원하는 대로 변경 가능)
    
    let allData = [];
    let useLocalStorage = false; // 서버 연결 실패 시 localStorage 사용

    // 비밀번호 확인
    function checkAuth() {
      const savedPassword = sessionStorage.getItem('adminAuth');
      if (savedPassword === ADMIN_PASSWORD) {
        return true;
      }
      
      const password = prompt('🔐 관리자 비밀번호를 입력하세요:');
      if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminAuth', password);
        return true;
      } else {
        alert('❌ 비밀번호가 틀렸습니다.');
        window.location.href = 'index.html';
        return false;
      }
    }

    async function loadData() {
      if (!checkAuth()) return;
      // 1) 서버에서 데이터 불러오기 시도
      try {
        const response = await fetch(`${BACKEND_URL}?action=getSubmissions`);
        const result = await response.json();
        
        if (result.success && result.data) {
          allData = result.data;
          useLocalStorage = false;
          console.log('✅ 서버에서 데이터 로드 성공');
        } else {
          throw new Error('서버 응답 오류');
        }
      } catch (error) {
        console.warn('⚠️ 서버 연결 실패, localStorage 사용:', error);
        // 2) 서버 연결 실패 시 localStorage 사용
        const data = JSON.parse(localStorage.getItem('contactSubmissions') || '[]');
        allData = data.sort((a, b) => new Date(b.ts) - new Date(a.ts));
        useLocalStorage = true;
      }
      
      updateStats();
      filterData();
      updateStatusBadge();
    }
    
    function updateStatusBadge() {
      const header = document.querySelector('header p');
      if (useLocalStorage) {
        header.innerHTML = '상담 신청 내역 관리 <span style="background:#d32f2f;color:white;padding:4px 8px;border-radius:4px;font-size:12px;margin-left:8px">⚠️ 로컬 모드</span>';
      } else {
        header.innerHTML = '상담 신청 내역 관리 <span style="background:#4caf50;color:white;padding:4px 8px;border-radius:4px;font-size:12px;margin-left:8px">✅ 서버 연결</span>';
      }
    }

    function updateStats() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

      document.getElementById('totalCount').textContent = allData.length;
      document.getElementById('todayCount').textContent = allData.filter(item => 
        new Date(item.ts) >= today
      ).length;
      document.getElementById('weekCount').textContent = allData.filter(item => 
        new Date(item.ts) >= weekAgo
      ).length;
      document.getElementById('monthCount').textContent = allData.filter(item => 
        new Date(item.ts) >= monthStart
      ).length;
    }

    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const productFilter = document.getElementById('productFilter').value;

      let filtered = allData;

      // 검색어 필터
      if (searchTerm) {
        filtered = filtered.filter(item => 
          (item.name || '').toLowerCase().includes(searchTerm) ||
          (item.email || '').toLowerCase().includes(searchTerm) ||
          (item.message || '').toLowerCase().includes(searchTerm)
        );
      }

      // 상품 필터
      if (productFilter) {
        filtered = filtered.filter(item => item.product === productFilter);
      }

      renderTable(filtered);
    }

    function renderTable(data) {
      const container = document.getElementById('tableContainer');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty">📭 저장된 상담 신청이 없습니다.</div>';
        return;
      }

      const table = `
        <table>
          <thead>
            <tr>
              <th>접수일시</th>
              <th>이름</th>
              <th>이메일</th>
              <th>관심상품</th>
              <th>통화시간</th>
              <th>문의내용</th>
              <th>작업</th>
            </tr>
          </thead>
          <tbody>
            ${data.map((item, index) => `
              <tr>
                <td style="white-space:nowrap">${formatDate(item.ts)}</td>
                <td><strong>${escapeHtml(item.name)}</strong></td>
                <td><a href="mailto:${item.email}" style="color:var(--brand)">${escapeHtml(item.email)}</a></td>
                <td><span class="badge">${escapeHtml(item.product)}</span></td>
                <td>${escapeHtml(item.time)}</td>
                <td class="message-cell" title="${escapeHtml(item.message)}">${escapeHtml(item.message)}</td>
                <td style="white-space:nowrap">
                  <button class="btn" style="padding:6px 12px;font-size:12px" onclick="viewDetail(${index})">상세</button>
                  <button class="btn danger" style="padding:6px 12px;font-size:12px" onclick="deleteItem('${item.ts}')">삭제</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      container.innerHTML = table;
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function viewDetail(index) {
      const item = allData[index];
      alert(`
[상담 신청 상세]

접수일시: ${formatDate(item.ts)}
이름: ${item.name}
이메일: ${item.email}
관심상품: ${item.product}
통화시간: ${item.time}

문의내용:
${item.message}
      `.trim());
    }

    function deleteItem(timestamp) {
      if (!confirm('이 항목을 삭제하시겠습니까?')) return;
      
      const data = JSON.parse(localStorage.getItem('contactSubmissions') || '[]');
      const filtered = data.filter(item => item.ts !== timestamp);
      localStorage.setItem('contactSubmissions', JSON.stringify(filtered));
      
      alert('삭제되었습니다.');
      loadData();
    }

    function clearAllData() {
      if (!confirm('⚠️ 모든 상담 신청 내역을 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.')) return;
      if (!confirm('정말로 삭제하시겠습니까?')) return;
      
      localStorage.removeItem('contactSubmissions');
      alert('모든 데이터가 삭제되었습니다.');
      loadData();
    }

    function downloadCSV() {
      if (allData.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }

      const header = ['접수일시', '이름', '이메일', '관심상품', '통화시간', '문의내용'];
      const rows = allData.map(item => {
        return [
          formatDate(item.ts),
          item.name,
          item.email,
          item.product,
          item.time,
          item.message
        ].map(val => {
          const escaped = (val || '').toString().replace(/"/g, '""').replace(/\n/g, ' ');
          return `"${escaped}"`;
        }).join(',');
      });

      const csv = [header.join(','), ...rows].join('\n');
      const BOM = '\uFEFF'; // UTF-8 BOM for Excel
      const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `상담신청_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function refreshData() {
      loadData();
    }

    // 검색 입력 이벤트
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').addEventListener('input', filterData);
      loadData();
    });
  </script>
</body>
</html>
