    </nav>
  </div>
</header>

<section class="page-hero">
  <video autoplay muted loop playsinline poster="../assets/video/hero-contact-poster.jpg">
    <source src="../assets/video/hero-contact.mp4" type="video/mp4" />
  </video>
  <div class="container">
    <div class="kicker">お問い合わせ</div>
    <h1>お問い合わせ・ご相談</h1>
    <p>デモのご依頼または技術相談はこちらから。1営業日以内にご返信いたします。メール: parkfund@naver.com ・電話: +82-2-588-2844</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <form action="#" method="post" onsubmit="return handleSubmit(event)">
      <div class="form-row">
        <div>
          <label for="name">お名前</label>
          <input id="name" name="name" placeholder="山田太郎" required />
        </div>
        <div>
          <label for="email">メールアドレス</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>ご関心分野（複数選択可）</label>
          <div class="checkbox-row">
            <label><input type="checkbox" name="interest" value="製品クオントレアX" /><span>製品クオントレアX</span></label>
            <label><input type="checkbox" name="interest" value="投資" /><span>投資</span></label>
          </div>
        </div>
        <div>
          <label for="time">ご希望のご相談時間</label>
          <input id="time" name="time" placeholder="例：平日午後2〜5時" />
        </div>
      </div>
      <div>
        <label for="message">ご要望内容</label>
        <textarea id="message" name="message" placeholder="現在の状況とご希望を簡単にご記入ください。" required></textarea>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" type="submit">相談を申し込む</button>
        <span class="meta" style="color:var(--muted);font-size:13px">送信をもって基本個人情報の取り扱いに同意したものとみなします。</span>
      </div>
      <div id="submit-status"></div>
    </form>
  </div>
</section>

  </div>
